<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragment::Head"></head>
<body>
<div th:replace="fragment::newnav2"></div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow border-0">
        <div class="card-header bg-danger text-white text-center py-3">
          <h3 class="mb-0">My Profile</h3>
        </div>
        <div class="card-body p-4">
          <h4>Welcome, <span th:text="${user.fullName}"></span> 👋</h4>
          <table class="table table-borderless mt-3">
            <tr><th>Email</th><td th:text="${user.email}"></td></tr>
            <tr><th>Phone</th><td th:text="${user.phone}"></td></tr>
            <tr><th>Gender</th><td th:text="${user.gender}"></td></tr>
            <tr><th>Religion</th><td th:text="${user.religion}"></td></tr>
            <tr><th>Marital Status</th><td th:text="${user.maritalStatus}"></td></tr>
            <tr><th>Occupation</th><td th:text="${user.occupation}"></td></tr>
            <tr><th>Location</th><td th:text="${user.city + ', ' + user.state}"></td></tr>
          </table>

          <form th:action="@{/logout}" method="post" class="mt-3">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="fragment::footer"></div>
</body>
</html>
